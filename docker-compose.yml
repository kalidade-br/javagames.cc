version: "3.9"

services:
  j2me-web-loader:
    build: .
    image: j2me-web-loader:latest
    container_name: j2me-web-loader

    ports:
      - "3000:3000"

    volumes:
      # Live code editing
      - .:/app

      # Keep container's node_modules
      - /app/node_modules

    command: npm run dev

    restart: unless-stopped