<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../j2me/logo/J2ME_icon_64x64.png">
    <title>J2ME Web Loader Game Runner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cyan: {
                50: '#ecfeff',
                100: '#cffafe',
                200: '#a5f3fc',
                300: '#67e8f9',
                400: '#22d3ee',
                500: '#06b6d4',
                600: '#0891b2',
                700: '#0e7490',
                800: '#155e75',
                900: '#164e63',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'Fira Code', 'monospace']
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f8fafc;
        }

        /* Screen Area Layout */
        #screen-area {
            background-color: #f8fafc;
            background-image: radial-gradient(#cffafe 1px, transparent 1px);
            background-size: 24px 24px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        /* Canvas Screen Frame */
        #display {
            background-color: #000000;
            zoom: 1;
            image-rendering: pixelated;
            border-radius: 0px !important;
            box-shadow: 0px 0px 8px #0891b2 !important;
        }
        #display:focus {
            outline: none;
            border-radius: 0px !important;
            box-shadow: 0px 0px 12px #0891b2 !important;
        }

        /* Loading Screen Overlay */
        #loading {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #loading.hidden, #loading.is-hidden, #loading[hidden] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Keypads */
        .keypad-part {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #cffafe;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            box-shadow: 0 -4px 20px rgba(6, 182, 212, 0.08);
            -webkit-tap-highlight-color: transparent;
            z-index: 30;
            overflow: visible;
        }

        body.kbd-has-custom-layout .keypad-part {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            pointer-events: none !important;
        }

        .key-grid {
            display: grid;
            gap: 8px;
            width: 100%;
            height: 100%;
        }

        .left-grid {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }

        .right-grid {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        /* Key Buttons */
        .key {
            position: relative;
            background-color: #f8fafc;
            color: #1e293b;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            user-select: none;
            touch-action: none;
            transition: background-color 0.1s ease, border-color 0.1s ease, transform 0.1s ease;
            line-height: 1.1;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            pointer-events: auto;
            z-index: 40;
        }

        body.kbd-edit-mode .key {
            cursor: move !important;
            transition: none !important;
        }

        .key span {
            font-size: 0.45em;
            font-weight: 600;
            margin-top: 2px;
            color: #0891b2;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        .key:hover {
            background-color: #ecfeff;
            border-color: #67e8f9;
            color: #0e7490;
        }

        /* Active Pressed Key state (toggled by screenKbd.js) */
        .key.active, .key:active {
            background-color: #06b6d4 !important;
            color: #ffffff !important;
            border-color: #0891b2 !important;
            transform: scale(0.93) !important;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4) !important;
        }
        .key.active span, .key:active span {
            color: #cffafe !important;
        }

        .arrow-key {
            font-size: 1.4em;
            color: #0891b2;
        }

        .ok-key {
            font-size: 1.1em;
            background-color: #ecfeff;
            border-color: #a5f3fc;
            color: #0891b2;
        }

        .small-key {
            width: 80%;
            height: 80%;
            font-size: 0.85em;
            align-self: center;
            padding: 2px;
            line-height: 1;
        }

        .small-key-left { justify-self: center; }
        .small-key-right { justify-self: center; }

        #left-keys, #right-keys {
            display: none;
            position: absolute;
            bottom: 0;
        }

        #left-keys { left: 0; }
        #right-keys { right: 0; }

        /* Keyboard layout modes toggled by main.js */
        body.kbd-portrait #left-keys,
        body.kbd-portrait #right-keys,
        body.kbd-landscape #left-keys,
        body.kbd-landscape #right-keys {
            display: flex;
        }

        body.kbd-portrait #left-keys,
        body.kbd-portrait #right-keys {
            width: 50%;
            height: 230px;
        }

        body.kbd-landscape #left-keys,
        body.kbd-landscape #right-keys {
            width: 230px;
            height: 100%;
            top: 0;
        }

        body.kbd-landscape #left-keys .key-grid,
        body.kbd-landscape #right-keys .key-grid {
            max-height: 400px;
        }

        body.kbd-portrait #screen-area {
            bottom: 230px;
        }

        body.kbd-landscape #screen-area {
            left: 230px;
            right: 230px;
        }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- TOP GAME OVERLAY CONTROLS -->
    <header id="game-top-header" class="fixed top-3 left-3 right-3 z-40 flex items-center justify-between pointer-events-none transition-all">
      <!-- Back to Launcher / Exit Game Button (Always Visible) -->
      <a href="./" class="pointer-events-auto px-3.5 py-2 text-xs font-bold text-slate-700 bg-white/90 hover:bg-cyan-50 hover:text-cyan-700 border border-cyan-200 rounded-xl shadow-sm backdrop-blur-md transition-all flex items-center gap-1.5 no-underline">
        <svg class="w-4 h-4 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        <span>Exit Game</span>
      </a>

      <!-- Quick Action Buttons -->
      <div class="pointer-events-auto flex items-center gap-2">
        
        <!-- Standard Header Controls (Hidden in Fullscreen) -->
        <div id="standard-header-controls" class="flex items-center gap-2 transition-all">
<button id="toggle-kbd-btn" class="px-3 py-2 text-xs font-semibold text-cyan-800 bg-cyan-50 hover:bg-cyan-100 border border-cyan-200 rounded-xl shadow-2xs backdrop-blur-md transition-all flex items-center gap-1 cursor-pointer">
  <!-- New Icon Inserted Here -->
  <svg class="w-3.5 h-3.5 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 17a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2Z" />
    <path d="M6 15v-2" />
    <path d="M12 15V9" />
    <circle cx="12" cy="6" r="3" />
  </svg>
  <span id="kbd-btn-label" class="hidden sm:inline">Keypad: OFF</span>
</button>


<button id="edit-kbd-btn" class="px-3 py-2 text-xs font-semibold text-cyan-900 bg-cyan-100/90 hover:bg-cyan-200 border border-cyan-300 rounded-xl shadow-2xs backdrop-blur-md transition-all flex items-center gap-1 cursor-pointer" title="Drag, resize, save, and export keypad layout">
  <svg class="w-3.5 h-3.5 text-cyan-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
  <!-- Added hidden sm:inline here -->
  <span class="hidden sm:inline">Customize Layout</span>
</button>

<button id="desktop-keys-btn" class="px-3 py-2 text-xs font-semibold text-cyan-800 bg-cyan-50 hover:bg-cyan-100 border border-cyan-200 rounded-xl shadow-2xs backdrop-blur-md transition-all flex items-center gap-1 cursor-pointer" title="Remap desktop keyboard keys & codes">
  <svg class="w-3.5 h-3.5 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 0121 9z"/></svg>
  <!-- Added hidden sm:inline here -->
  <span class="hidden sm:inline">Desktop Controls</span>
</button>



        </div>

        <!-- Fullscreen / Minimize Button (Always Visible) -->
        <button id="fullscreen-toggle-btn" class="px-3 py-2 text-xs font-semibold text-slate-700 bg-white/90 hover:bg-cyan-50 border border-slate-200 rounded-xl shadow-2xs backdrop-blur-md transition-all flex items-center gap-1 cursor-pointer">
          <svg id="fullscreen-enter-icon" class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
          <svg id="fullscreen-exit-icon" class="w-3.5 h-3.5 text-rose-600 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 9L4 4m0 0v4m0-4h4m6 0l5 5m0-5h-4m4 0v4m-5 11l5 5m0 0v-4m0 4h-4m-6 0l-5-5m0 5h4m-4 0v-4"/></svg>
          <span id="fullscreen-btn-label">Fullscreen</span>
        </button>

      </div>
    </header>

    <!-- SCREEN AREA FOR EMULATOR CANVAS -->
    <div id="screen-area">
        <canvas tabindex="0" id="display" style="display: none;"></canvas>
        <div id="loading" class="p-6 text-center">
          <!-- Game Icon inside Single Spinning Circle -->
          <div class="relative flex items-center justify-center w-20 h-20 mx-auto mb-4">
            <!-- Single Spinning Ring -->
            <div class="absolute inset-0 rounded-full border-4 border-cyan-100 border-t-cyan-500 animate-spin"></div>
            <!-- Centered Game Icon Container -->
            <div class="w-12 h-12 rounded-sm bg-white p-1 flex items-center justify-center shadow-xs overflow-hidden z-10">
              <img id="loading-game-icon" class="w-full h-full object-contain hidden" alt="Game Icon" />
              <svg id="loading-fallback-icon" class="w-10 h-10 text-cyan-600"">
                <use href="../j2me/java_icon.svg"></use>
              </svg>
            </div>
          </div>
          
          <!-- Game Title -->
          <h2 id="loading-game-title" class="text-base font-extrabold text-slate-800 tracking-tight mb-2 max-w-xs truncate mx-auto">J2ME Web Loader</h2>
          
          <!-- Status Pill -->
          <span id="loading-status" class="inline-block text-xs font-semibold text-cyan-700 bg-cyan-50 px-3.5 py-1.5 rounded-full border border-cyan-200 animate-pulse">
            Loading CheerpJ JVM...
          </span>
        </div>
    </div>

    <!-- LEFT KEYPAD PART -->
    <div id="left-keys" class="keypad-part">
        <div class="key-grid left-grid">
            <button data-key="Digit1" class="key">1</button>
            <button data-key="Digit2" class="key">2 <span>ABC</span></button>
            <button data-key="Digit3" class="key">3 <span>DEF</span></button>
            <button data-key="Digit4" class="key">4 <span>GHI</span></button>
            <button data-key="Digit5" class="key">5 <span>JKL</span></button>
            <button data-key="Digit6" class="key">6 <span>MNO</span></button>
            <button data-key="Digit7" class="key">7 <span>PQRS</span></button>
            <button data-key="Digit8" class="key">8 <span>TUV</span></button>
            <button data-key="Digit9" class="key">9 <span>WXYZ</span></button>
            <button data-key="NumpadAsterisk" class="key">*</button>
            <button data-key="Digit0" class="key">0 <span>+</span></button>
            <button data-key="NumpadDivide" class="key">#</button>
        </div>
    </div>

    <!-- RIGHT KEYPAD PART -->
    <div id="right-keys" class="keypad-part">
         <div class="key-grid right-grid">
            <button data-key="F1" class="key">L</button>
            <button data-key="ArrowUp" class="key arrow-key" aria-label="Up">↑</button>
            <button data-key="F2" class="key">R</button>
            <button data-key="ArrowLeft" class="key arrow-key" aria-label="Left">←</button>
            <button data-key="Enter" class="key ok-key">OK</button>
            <button data-key="ArrowRight" class="key arrow-key" aria-label="Right">→</button>
            <button data-key="Escape" class="key small-key small-key-left">Esc</button>
            <button data-key="ArrowDown" class="key arrow-key" aria-label="Down">↓</button>
            <button data-key="Maximize" class="key small-key small-key-right" aria-label="Maximize">⛶</button>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
